name: SLSA generic generator

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Replace these commands with your actual project build.
      - name: Build artifacts
        run: |
          echo "artifact1" > artifact1
          echo "artifact2" > artifact2

      # Replace these filenames with your actual release files.
      - name: Generate subjects for provenance
        id: hash
        shell: bash
        run: |
          set -euo pipefail
          echo "hashes=$(sha256sum artifact1 artifact2 | base64 -w0)" >> "$GITHUB_OUTPUT"

      - name: Save build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: |
            artifact1
            artifact2
          if-no-files-found: error

  provenance:
    needs: build

    permissions:
      actions: read
      id-token: write
      contents: write

    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0

    with:
      base64-subjects: ${{ needs.build.outputs.hashes }}
      upload-assets: ${{ github.event_name == 'release' }}

  upload-release-files:
    if: github.event_name == 'release'
    needs: [build, provenance]
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-files
          path: release-files

      - name: Upload files to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$RELEASE_TAG" \
            release-files/artifact1 \
            release-files/artifact2 \
            --clobber
